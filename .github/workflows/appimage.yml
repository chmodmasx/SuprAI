name: appimage-preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/appimage.yml'
      - 'packaging/**'
      - 'scripts/package-appimage.sh'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'tests/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/appimage.yml'
      - 'packaging/**'
      - 'scripts/package-appimage.sh'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'tests/**'

concurrency:
  group: suprai-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-appimage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install build and smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build build-essential libgl1-mesa-dev libgles2-mesa-dev \
            libwayland-dev libwayland-egl1-mesa libxkbcommon-dev \
            xvfb weston desktop-file-utils curl
      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtwaylandcompositor'
          cache: true
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUPRAI_BUILD_TESTS=ON
          cmake --build build --parallel
      - name: Unit/integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Create AppImage and SHA256
        run: bash scripts/package-appimage.sh
      - name: Validate packaged X11/XCB launch
        run: |
          output="$(xvfb-run -a env -u LD_LIBRARY_PATH \
            -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u QT_ROOT_DIR \
            QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software \
            APPIMAGE_EXTRACT_AND_RUN=1 SUPRAI_RUNTIME=mock \
            "$PWD/dist/SuprAI-0.1.0-alpha.1-x86_64.AppImage" --smoke-test 2>&1)"
          printf '%s\n' "$output"
          if grep -Eq 'shutdown_timeout|persistence_worker_error|QQmlApplicationEngine failed' <<<"$output"; then
            exit 1
          fi
      - name: Validate packaged Wayland launch
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/suprai-weston-appimage"
          export WAYLAND_DISPLAY="wayland-suprai-appimage"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 --width=1280 --height=800 \
            >"$RUNNER_TEMP/weston-appimage.log" 2>&1 &
          WESTON_PID=$!
          trap 'kill "$WESTON_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            cat "$RUNNER_TEMP/weston-appimage.log"
            exit 1
          fi
          output="$(env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH \
            -u QML2_IMPORT_PATH -u QT_ROOT_DIR \
            QT_QPA_PLATFORM=wayland QT_QUICK_BACKEND=software \
            APPIMAGE_EXTRACT_AND_RUN=1 SUPRAI_RUNTIME=mock \
            ./dist/SuprAI-0.1.0-alpha.1-x86_64.AppImage --smoke-test 2>&1)"
          printf '%s\n' "$output"
          if grep -Eq 'shutdown_timeout|persistence_worker_error|QQmlApplicationEngine failed' <<<"$output"; then
            exit 1
          fi
      - name: Upload verified AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SuprAI-0.1.0-alpha.1-x86_64
          path: |
            dist/SuprAI-0.1.0-alpha.1-x86_64.AppImage
            dist/SuprAI-0.1.0-alpha.1-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    needs: build-appimage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SuprAI-0.1.0-alpha.1-x86_64
          path: dist
      - name: Publish initial alpha AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-alpha.1" \
            "dist/SuprAI-0.1.0-alpha.1-x86_64.AppImage" \
            "dist/SuprAI-0.1.0-alpha.1-x86_64.AppImage.sha256" \
            --target "$GITHUB_SHA" \
            --title "SuprAI 0.1.0 alpha 1 (Linux x86_64)" \
            --prerelease \
            --notes "Experimental Linux AppImage. Qt 6.12 on Ubuntu 24.04 CI; X11/Wayland packaged startup tested. Requires a reachable OpenAI-compatible provider. Physical KDE/GNOME and older distro compatibility unverified."
