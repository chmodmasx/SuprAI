name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev xvfb weston

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          modules: 'qtwaylandcompositor'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUPRAI_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: QML startup smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          SUPRAI_RUNTIME: mock
        run: ./build/src/suprai --smoke-test

      - name: Stage portable install tree
        run: |
          rm -rf stage
          cmake --install build --prefix "$PWD/stage"
          test -x stage/bin/suprai
          test -f stage/bin/qt.conf
          test -f stage/plugins/platforms/libqxcb.so
          test -f stage/plugins/platforms/libqwayland.so

      - name: Staged install smoke test
        run: |
          xvfb-run -a env -u LD_LIBRARY_PATH \
              -u QT_PLUGIN_PATH \
              -u QML2_IMPORT_PATH \
              -u QT_ROOT_DIR \
              QT_QPA_PLATFORM=xcb \
              QT_QUICK_BACKEND=software \
              SUPRAI_RUNTIME=mock \
              ./stage/bin/suprai --smoke-test

      - name: Staged Wayland smoke test
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/suprai-weston"
          export WAYLAND_DISPLAY="wayland-suprai"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          weston \
            --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 \
            --width=1280 \
            --height=800 \
            >"$RUNNER_TEMP/weston.log" 2>&1 &
          WESTON_PID=$!
          trap 'kill "$WESTON_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 50); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
              break
            fi
            sleep 0.1
          done

          if [ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          fi

          env -u LD_LIBRARY_PATH \
              -u QT_PLUGIN_PATH \
              -u QML2_IMPORT_PATH \
              -u QT_ROOT_DIR \
              XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" \
              WAYLAND_DISPLAY="$WAYLAND_DISPLAY" \
              QT_QPA_PLATFORM=wayland \
              QT_QUICK_BACKEND=software \
              SUPRAI_RUNTIME=mock \
              ./stage/bin/suprai --smoke-test
