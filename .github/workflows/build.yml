name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev xvfb

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSUPRAI_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: QML startup smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          SUPRAI_RUNTIME: mock
        run: ./build/src/suprai --smoke-test

      - name: Stage portable install tree
        run: |
          rm -rf stage
          cmake --install build --prefix "$PWD/stage"
          test -x stage/bin/suprai
          test -f stage/bin/qt.conf
          test -f stage/plugins/platforms/libqxcb.so
          test -f stage/plugins/platforms/libqwayland.so

      - name: Staged install smoke test
        run: |
          xvfb-run -a env -u LD_LIBRARY_PATH \
              -u QT_PLUGIN_PATH \
              -u QML2_IMPORT_PATH \
              -u QT_ROOT_DIR \
              QT_QPA_PLATFORM=xcb \
              QT_QUICK_BACKEND=software \
              SUPRAI_RUNTIME=mock \
              ./stage/bin/suprai --smoke-test
